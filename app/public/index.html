<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediTrack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
    header { background: #1a73e8; color: white; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 24px; }
    header span { font-size: 14px; opacity: 0.8; }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
    .card .number { font-size: 36px; font-weight: bold; color: #1a73e8; }
    .section { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .section h2 { font-size: 18px; margin-bottom: 16px; border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px; background: #f0f4f8; font-size: 13px; color: #666; }
    td { padding: 10px; border-bottom: 1px solid #f0f4f8; font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge.scheduled { background: #e8f5e9; color: #2e7d32; }
    .badge.cancelled { background: #fce4ec; color: #c62828; }
  </style>
</head>
<body>
  <header>
    <h1>MediTrack</h1>
    <span>Patient Appointment System</span>
  </header>
  <div class="container">
    <div class="cards">
      <div class="card"><h3>Total Patients</h3><div class="number" id="patientCount">-</div></div>
      <div class="card"><h3>Total Appointments</h3><div class="number" id="appointmentCount">-</div></div>
      <div class="card"><h3>System Status</h3><div class="number" style="font-size:20px;color:#2e7d32" id="status">-</div></div>
    </div>
    <div class="section">
      <h2>Registered Patients</h2>
      <table>
        <thead><tr><th>Name</th><th>Date of Birth</th><th>Email</th><th>Insurance ID</th></tr></thead>
        <tbody id="patientsTable"></tbody>
      </table>
    </div>
    <div class="section">
      <h2>Upcoming Appointments</h2>
      <table>
        <thead><tr><th>Patient</th><th>Provider</th><th>Department</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
        <tbody id="appointmentsTable"></tbody>
      </table>
    </div>
  </div>
  <script>
    async function load() {
      const [patients, appointments, health] = await Promise.all([
        fetch('/api/patients').then(r => r.json()),
        fetch('/api/appointments').then(r => r.json()),
        fetch('/health').then(r => r.json())
      ]);
      document.getElementById('patientCount').textContent = patients.length;
      document.getElementById('appointmentCount').textContent = appointments.length;
      document.getElementById('status').textContent = health.status;
      document.getElementById('patientsTable').innerHTML = patients.map(p =>
        `<tr><td>${p.firstName} ${p.lastName}</td><td>${p.dob}</td><td>${p.email}</td><td>${p.insuranceId}</td></tr>`
      ).join('');
      document.getElementById('appointmentsTable').innerHTML = appointments.map(a =>
        `<tr><td>${a.patientName}</td><td>${a.provider}</td><td>${a.department}</td><td>${a.date}</td><td>${a.time}</td><td><span class="badge ${a.status}">${a.status}</span></td></tr>`
      ).join('');
    }
    load();
  </script>
</body>
</html>
